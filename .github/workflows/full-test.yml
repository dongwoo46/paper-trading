name: full-test
on: [pull_request, push]
jobs:
  trading-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 전체 시험 + ktlint + detekt + baseline 증가 차단 (병렬)
        working-directory: backend/trading-api
        # PR 은 base 브랜치 baseline 과 비교, push 는 HEAD 비교(PR 실행이 본 검사)
        env:
          LINT_BASELINE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: ./gradlew test ktlintCheck detekt verifyLintBaselinesNotGrown --parallel ${LINT_BASELINE_REF:+-PlintBaselineRef=$LINT_BASELINE_REF}
  collector-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 전체 시험 (병렬)
        working-directory: backend/collector-api
        run: ./gradlew test --parallel
  trading-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/trading-web/package-lock.json
      - name: 의존성 설치
        working-directory: frontend/trading-web
        run: npm ci
      - name: 빌드
        working-directory: frontend/trading-web
        run: npm run build
      - name: 린트
        working-directory: frontend/trading-web
        run: npm run lint
      - name: 전체 시험 (병렬)
        working-directory: frontend/trading-web
        run: npm test -- --run -- --maxWorkers=2
