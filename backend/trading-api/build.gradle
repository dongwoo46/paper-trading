plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.1.20'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.1.20'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.1.20'
	id 'org.jetbrains.kotlin.kapt' version '2.1.20'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
	id 'io.gitlab.arturbosch.detekt' version '1.23.8'
}

group = 'com.papertrading'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll('-Xjsr305=strict')
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	kapt 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	kapt 'jakarta.annotation:jakarta.annotation-api'
	kapt 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'io.mockk:mockk:1.13.10'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 로컬 -Darchunit.* 옵션의 시험 JVM 전달(동결 저장소 의도 갱신용)
	System.properties.each { key, value ->
		if (key.toString().startsWith('archunit.')) {
			systemProperty key.toString(), value
		}
	}
}

// 기존 위반은 baseline 에 묶고 새 위반만 check 에서 실패시킨다. baseline 갱신은 ktlintGenerateBaseline 으로만 한다.
ktlint {
	version = '1.8.0'
	baseline = file('config/ktlint/baseline.xml')
}

// 기존 위반은 baseline 에 묶는다. baseline 갱신은 detektBaseline 으로만 한다.
detekt {
	buildUponDefaultConfig = true
	baseline = file('config/detekt/baseline.xml')
}

// detekt 설정의 Kotlin 의존성 2.0.21 고정: detekt 1.23.8 은 Kotlin 2.0.21 빌드, 2.1.20 실행 거부(프로젝트 Kotlin 은 2.1.20 유지)
configurations.matching { it.name == 'detekt' }.configureEach {
	resolutionStrategy.eachDependency {
		if (requested.group == 'org.jetbrains.kotlin') {
			useVersion('2.0.21')
		}
	}
}
