plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.1.20'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.1.20'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.1.20'
	id 'org.jetbrains.kotlin.kapt' version '2.1.20'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
	id 'io.gitlab.arturbosch.detekt' version '1.23.8'
}

group = 'com.papertrading'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll('-Xjsr305=strict')
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	kapt 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	kapt 'jakarta.annotation:jakarta.annotation-api'
	kapt 'jakarta.persistence:jakarta.persistence-api'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'io.mockk:mockk:1.13.10'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 로컬 -Darchunit.* 옵션의 시험 JVM 전달(동결 저장소 의도 갱신용)
	System.properties.each { key, value ->
		if (key.toString().startsWith('archunit.')) {
			systemProperty key.toString(), value
		}
	}
}

// 기존 위반 baseline 고정·새 위반만 check 실패, baseline 갱신은 ktlintGenerateBaseline 한정
ktlint {
	version = '1.8.0'
	baseline = file('config/ktlint/baseline.xml')
}

// 기존 위반 baseline 고정, baseline 갱신은 detektBaseline 한정
detekt {
	buildUponDefaultConfig = true
	baseline = file('config/detekt/baseline.xml')
}

// detekt 설정 Kotlin 2.0.21 고정: detekt 1.23.8 은 Kotlin 2.0.21 빌드·2.1.20 실행 거부(프로젝트 Kotlin 2.1.20 유지)
configurations.matching { it.name == 'detekt' }.configureEach {
	resolutionStrategy.eachDependency {
		if (requested.group == 'org.jetbrains.kotlin') {
			useVersion('2.0.21')
		}
	}
}

// ktlint 설정 Kotlin 2.2.21 고정: ktlint 1.8.0 은 Kotlin 2.2.21 빌드, Spring 의존성 관리가 2.1.20 으로 내려 조용히 어긋남(프로젝트 Kotlin 2.1.20 유지)
configurations.matching { it.name == 'ktlint' }.configureEach {
	resolutionStrategy.eachDependency {
		if (requested.group == 'org.jetbrains.kotlin') {
			useVersion('2.2.21')
		}
	}
}

// 린트 baseline 항목 수 증가 차단: 기준 ref(기본 HEAD, CI 는 -PlintBaselineRef=origin/<base>)보다 늘면 실패, baseline 재생성의 새 위반 흡수 방지
tasks.register('verifyLintBaselinesNotGrown') {
	group = 'verification'
	description = 'ktlint·detekt baseline 항목 수가 기준 ref 보다 늘면 실패'
	def ref = providers.gradleProperty('lintBaselineRef').getOrElse('HEAD')
	def dir = projectDir
	def targets = [
		'config/ktlint/baseline.xml': ~/<error /,
		'config/detekt/baseline.xml': ~/<ID>/,
	]
	doLast {
		def git = { String... args ->
			def process = new ProcessBuilder(['git'] + args.toList()).directory(dir).redirectErrorStream(true).start()
			def output = process.inputStream.getText('UTF-8')
			[process.waitFor(), output]
		}
		if (git('rev-parse', '--verify', '--quiet', "${ref}^{commit}")[0] != 0) {
			throw new GradleException("lintBaselineRef 를 해석할 수 없음: ${ref}")
		}
		targets.each { path, pattern ->
			def (code, committed) = git('show', "${ref}:./${path}")
			if (code != 0) {
				logger.lifecycle("${path}: ${ref} 에 없음(신규 도입), 비교 생략")
				return
			}
			def before = (committed =~ pattern).count
			def after = (new File(dir, path).getText('UTF-8') =~ pattern).count
			logger.lifecycle("${path}: ${ref} ${before}건 -> 현재 ${after}건")
			if (after > before) {
				throw new GradleException("${path} 항목이 ${before}건에서 ${after}건으로 늘어남: baseline 재생성으로 새 위반을 흡수하지 말고 위반을 고칠 것")
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyLintBaselinesNotGrown'
}
