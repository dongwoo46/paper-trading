spring:
  application:
    name: trading-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paper}
    username: ${DB_USERNAME:paper}
    password: ${DB_PASSWORD:paper}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

trading:
  collector-api:
    base-url: ${COLLECTOR_API_URL:http://localhost:8081}
  kis:
    paper-app-key: ${KIS_PAPER_APP_KEY:}
    paper-app-secret: ${KIS_PAPER_APP_SECRET:}
    live-app-key: ${KIS_LIVE_APP_KEY:}
    live-app-secret: ${KIS_LIVE_APP_SECRET:}
    paper-ws-url: ${KIS_PAPER_WS_URL:ws://ops.koreainvestment.com:31000}
    live-ws-url: ${KIS_LIVE_WS_URL:ws://ops.koreainvestment.com:21000}
    execution-ws-enabled: ${KIS_EXECUTION_WS_ENABLED:false}
    paper-execution-channel: ${KIS_PAPER_EXECUTION_CHANNEL:H0STCNI9}
    live-execution-channel: ${KIS_LIVE_EXECUTION_CHANNEL:H0STCNI0}
    ws-reconnect-initial-backoff-millis: ${KIS_WS_RECONNECT_INITIAL_BACKOFF_MILLIS:1000}
    ws-reconnect-max-backoff-millis: ${KIS_WS_RECONNECT_MAX_BACKOFF_MILLIS:30000}
    ws-reconnect-max-attempts: ${KIS_WS_RECONNECT_MAX_ATTEMPTS:5}

server:
  port: 8080
