spring:
  application:
    name: trading-api
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paper}
    username: ${DB_USERNAME:paper}
    password: ${DB_PASSWORD:paper}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

trading:
  collector-api:
    base-url: ${COLLECTOR_API_URL:http://localhost:8081}
  kis:
    paper-app-key: ${KIS_PAPER_APP_KEY:}
    paper-app-secret: ${KIS_PAPER_APP_SECRET:}
    live-app-key: ${KIS_LIVE_APP_KEY:}
    live-app-secret: ${KIS_LIVE_APP_SECRET:}
    paper-ws-url: ${KIS_PAPER_WS_URL:ws://ops.koreainvestment.com:31000}
    live-ws-url: ${KIS_LIVE_WS_URL:ws://ops.koreainvestment.com:21000}
    execution-ws-enabled: ${KIS_EXECUTION_WS_ENABLED:false}
    paper-execution-channel: ${KIS_PAPER_EXECUTION_CHANNEL:H0STCNI9}
    live-execution-channel: ${KIS_LIVE_EXECUTION_CHANNEL:H0STCNI0}
    ws-reconnect-initial-backoff-millis: ${KIS_WS_RECONNECT_INITIAL_BACKOFF_MILLIS:1000}
    ws-reconnect-max-backoff-millis: ${KIS_WS_RECONNECT_MAX_BACKOFF_MILLIS:30000}
    ws-reconnect-max-attempts: ${KIS_WS_RECONNECT_MAX_ATTEMPTS:5}
  # 토스 연동: 필수 4개 중 하나라도 비면 토스만 비활성(앱은 기동), 값은 환경변수로만
  toss:
    base-url: ${TOSS_BASE_URL:}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    token-encryption-key: ${TOSS_TOKEN_ENCRYPTION_KEY:}
    token-previous-encryption-key: ${TOSS_TOKEN_PREVIOUS_ENCRYPTION_KEY:}
    token-refresh-skew-seconds: ${TOSS_TOKEN_REFRESH_SKEW_SECONDS:60}
    token-lock-ttl-millis: ${TOSS_TOKEN_LOCK_TTL_MILLIS:20000}
    token-lock-wait-millis: ${TOSS_TOKEN_LOCK_WAIT_MILLIS:15000}
    token-request-deadline-millis: ${TOSS_TOKEN_REQUEST_DEADLINE_MILLIS:20000}
    # 429 를 받았을 때만: 재시도 횟수와 Retry-After 대기 시간 합계의 상한(429 대기 예산), max-wait 0 이면 429 는 기다리지 않고 실패
    rate-limit-max-retries: ${TOSS_RATE_LIMIT_MAX_RETRIES:2}
    rate-limit-max-wait-millis: ${TOSS_RATE_LIMIT_MAX_WAIT_MILLIS:5000}
    # 호출 한도 줄에서 한 호출이 슬롯을 기다릴 수 있는 시간의 상한, 넘으면 TOSS_RATE_LIMITED, 429 대기 예산과 따로
    # 설정된 그룹 간격(올림 1000 ÷ 초당 한도) 중 최댓값 이상이어야 하고 아니면 범위 오류로 토스만 비활성
    rate-limit-max-queue-wait-millis: ${TOSS_RATE_LIMIT_MAX_QUEUE_WAIT_MILLIS:5000}
    # 초당 호출 한도, 기본값은 토스 조사 문서(2026-11-15) 수치이고 토스가 사전 공지 없이 바꿀 수 있어 환경변수로 덮음
    rate-limits:
      AUTH: ${TOSS_RATE_LIMIT_AUTH:5}
      ACCOUNT: ${TOSS_RATE_LIMIT_ACCOUNT:1}
      ASSET: ${TOSS_RATE_LIMIT_ASSET:5}
      ORDER_INFO: ${TOSS_RATE_LIMIT_ORDER_INFO:6}
      MARKET_DATA: ${TOSS_RATE_LIMIT_MARKET_DATA:15}
      MARKET_DATA_CHART: ${TOSS_RATE_LIMIT_MARKET_DATA_CHART:20}
  notification:
    slack:
      enabled: ${TRADING_NOTIFICATION_SLACK_ENABLED:false}
      webhook-url: ${SLACK_WEBHOOK_URL:}
      timeout-millis: ${TRADING_NOTIFICATION_SLACK_TIMEOUT_MILLIS:3000}
      max-retries: ${TRADING_NOTIFICATION_SLACK_MAX_RETRIES:1}
      retry-backoff-millis: ${TRADING_NOTIFICATION_SLACK_RETRY_BACKOFF_MILLIS:500}
      enabled-types: ${TRADING_NOTIFICATION_SLACK_ENABLED_TYPES:}

server:
  port: 8080
